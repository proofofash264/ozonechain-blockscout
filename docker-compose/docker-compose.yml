version: "3.9"

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "100m"
    max-file: "3"

services:
  redis-db:
    extends:
      file: ./services/redis.yml
      service: redis-db
    logging: *default-logging

  db-init:
    extends:
      file: ./services/db.yml
      service: db-init
    logging: *default-logging

  db:
    depends_on:
      db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/db.yml
      service: db
    logging: *default-logging

  backend:
    depends_on:
      - db
      - redis-db
    extends:
      file: ./services/backend.yml
      service: backend
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: 11.2.1
    pull_policy: build
    command: sh -c "cp -f /app/config/config_helper.exs /app/releases/11.2.1/config_helper.exs && bin/blockscout eval \"Elixir.Explorer.ReleaseTasks.create_and_migrate()\" && bin/blockscout start"
    links:
      - db:database
    environment:
      ETHEREUM_JSONRPC_HTTP_URL: https://rpc2-mainnet-blockscout.ozonescan.com/rpc/
      ETHEREUM_JSONRPC_TRACE_URL: https://rpc2-mainnet-blockscout.ozonescan.com/rpc/
      ETHEREUM_JSONRPC_WS_URL: wss://rpc2-mainnet-blockscout.ozonescan.com/ws/
      CHAIN_ID: "10121"
      RELEASE_COOKIE: blockscout_cookie
    logging: *default-logging

  nft_media_handler:
    depends_on:
      - backend
    extends:
      file: ./services/nft_media_handler.yml
      service: nft_media_handler
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
      args:
        RELEASE_VERSION: 11.2.1
    logging: *default-logging

  visualizer:
    extends:
      file: ./services/visualizer.yml
      service: visualizer
    logging: *default-logging

  sig-provider:
    extends:
      file: ./services/sig-provider.yml
      service: sig-provider
    logging: *default-logging

  frontend:
    depends_on:
      - backend
    extends:
      file: ./services/frontend.yml
      service: frontend
    logging: *default-logging

  stats-db-init:
    extends:
      file: ./services/stats.yml
      service: stats-db-init
    logging: *default-logging

  stats-db:
    depends_on:
      stats-db-init:
        condition: service_completed_successfully
    extends:
      file: ./services/stats.yml
      service: stats-db
    logging: *default-logging

  stats:
    depends_on:
      - stats-db
      - backend
    extends:
      file: ./services/stats.yml
      service: stats
    logging: *default-logging

  user-ops-indexer:
    depends_on:
      - db
      - backend
    extends:
      file: ./services/user-ops-indexer.yml
      service: user-ops-indexer
    logging: *default-logging

  proxy:
    depends_on:
      - backend
      - frontend
      - stats
    extends:
      file: ./services/nginx.yml
      service: proxy
    logging: *default-logging
